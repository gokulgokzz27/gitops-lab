apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jenkins
  namespace: argocd-1
spec:
  project: default

  source:
    repoURL: https://github.com/gokulgokzz27/gitops-lab.git
    targetRevision: HEAD
    path: apps/jenkins

  destination:
    server: https://kubernetes.default.svc
    namespace: jenkins

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

